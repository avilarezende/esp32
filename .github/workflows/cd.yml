name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: Criar GitHub Release com o firmware.bin
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install verified PlatformIO dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Build firmware
        run: pio run -j 2

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin dist/esp32dev-firmware.bin
          cp .pio/build/esp32dev/firmware.elf dist/esp32dev-firmware.elf
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32-firmware-release
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47afaa1c8dbe4f0e39d2be # v2
        with:
          files: |
            dist/esp32dev-firmware.bin
            dist/esp32dev-firmware.elf
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47afaa1c8dbe4f0e39d2be # v2
        with:
          tag_name: manual-${{ github.run_number }}
          name: Manual firmware build #${{ github.run_number }}
          files: |
            dist/esp32dev-firmware.bin
            dist/esp32dev-firmware.elf
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-secrets-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Garantir que secrets.h nunca é versionado
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src/secrets.h 2>/dev/null; then
            echo "ERRO: src/secrets.h está versionado no repositório!"
            exit 1
          fi
          echo "OK: src/secrets.h não está versionado."
          test -f .gitignore
          grep -q "src/secrets.h" .gitignore
          test -f src/secrets.example.h
          echo "OK: secrets.example.h presente e secrets.h no .gitignore."

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run unit tests
        run: python -m pytest tests -v

  firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-secrets-template, unit-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install verified PlatformIO dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Compile ESP32 firmware with template credentials
        run: pio run -j 2
      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-esp32dev
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-secrets-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Garantir que secrets.h nunca é versionado
        run: |
          if git ls-files --error-unmatch src/secrets.h 2>/dev/null; then
            echo "ERRO: src/secrets.h está versionado no repositório!"
            exit 1
          fi
          echo "OK: src/secrets.h não está versionado."
          test -f .gitignore && grep -q "src/secrets.h" .gitignore
  firmware-build:
    runs-on: ubuntu-latest
    needs: validate-secrets-template
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install verified PlatformIO dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Compile ESP32 firmware with template credentials
        run: pio run -j 2

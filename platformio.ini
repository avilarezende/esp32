; PlatformIO Project Configuration File
;
; Projeto ESP32 de referência — sensores + MQTT + OTA
; Compile com: pio run
; Upload:      pio run -t upload
;
; Não esqueça de preencher src/secrets.h antes de compilar.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Otimização para tamanho no release
build_flags =
    -Os
    -Wall
    -Werror=return-type
    -DCORE_DEBUG_LEVEL=2

; Monitor serial
monitor_speed = 115200

; Upload via USB por padrão
upload_protocol = esptool

; Gera src/secrets.h automaticamente a partir do template na primeira build
extra_scripts = pre:scripts/ensure_secrets.py

; Arquivos que não devem ser indexados nem enviados
ignore = src/secrets.h